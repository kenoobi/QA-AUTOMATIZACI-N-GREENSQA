webdriver {
  driver = chrome
  base.url = "https://www.latamairlines.com/co/es"
  capabilities {
    browserName = "chrome"
    "goog:chromeOptions" {
      args = ["--headless=new", "--window-size=1440,1100", "--disable-notifications", "--no-sandbox"]
    }
  }
  timeouts {
    implicitlywait = 1000
    fluentwait = 20000
  }
}

serenity {
  project.name = "GreenSQA - LATAM Shift Right POC"
  take.screenshots = FOR_FAILURES
}
